<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Gastos - Ejecutivo Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .custom-shadow {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body class="p-4 md:p-8">

    <!-- PANTALLA DE LOGIN -->
    <div id="loginView" class="min-h-[80vh] flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 w-full max-w-md">
            <div class="text-center mb-8">
                <div class="mb-4">
                    <img src="/static/logo.png" alt="UIB Logo" class="h-32 w-auto mx-auto drop-shadow-sm">
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Aplicación de Administración de Gastos</h1>
                <p id="authSubtitle" class="text-slate-500 text-sm mt-1">Acceso Ejecutivo</p>
            </div>

            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Usuario (Ejecutivo)</label>

                    <!-- Login Mode: Dropdown -->
                    <select id="loginUserSelect" required
                        class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        <option value="" disabled selected>Cargando usuarios...</option>
                    </select>

                    <!-- Register Mode: Input -->
                    <input type="text" id="loginUserInput" placeholder="Nombre de usuario" disabled
                        class="hidden w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="loginPass" required placeholder="••••••••"
                        class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div id="confirmPassDiv" class="hidden">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Confirmar Contraseña</label>
                    <input type="password" id="confirmLoginPass" placeholder="••••••••"
                        class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <button type="submit" id="loginSubmitBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-all shadow-lg shadow-blue-100">
                    Iniciar Sesión
                </button>
            </form>

            <div class="mt-4 text-center">
                <button onclick="toggleLoginMode()" id="toggleAuthBtn"
                    class="text-sm text-blue-600 font-semibold hover:underline">
                    ¿Nuevo usuario? Regístrese aquí
                </button>
            </div>

            <div id="loginError" class="mt-4 text-red-500 text-sm text-center font-medium hidden">
                Error de autenticación.
            </div>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL (DASHBOARD) -->
    <div id="mainView" class="max-w-6xl mx-auto hidden">
        <!-- Header con Logout -->
        <header class="mb-8 flex flex-col md:flex-row justify-between items-center gap-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex items-center gap-4">
                <img src="/static/logo.png" alt="UIB Logo" class="h-20 w-auto">
                <div>
                    <h1 class="text-2xl font-bold text-slate-800">Aplicación de Administración de Gastos</h1>
                    <p class="text-slate-500 text-sm">Sesión: <span id="currentUserLabel" class="font-bold text-blue-600"></span></p>
                </div>
            </div>
            <button onclick="logout()"
                class="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 rounded-xl font-semibold hover:bg-red-100 transition-colors border border-red-100">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                    </path>
                </svg>
                Cerrar Sesión
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Formulario Section -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-2xl custom-shadow border border-slate-100">
                    <h2 class="text-xl font-semibold mb-6 text-slate-700 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Nuevo Registro
                    </h2>

                    <form id="expenseForm" class="space-y-4">
                        <!-- Ejecutivo (Bloqueado) -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Ejecutivo Registrador</label>
                            <input type="text" id="ejecutivo" readonly
                                class="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-lg text-slate-500 cursor-not-allowed">
                        </div>

                        <!-- Fecha -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Fecha del Recibo</label>
                            <input type="date" id="fecha" required
                                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        </div>

                        <!-- Categoría -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Categoría</label>
                            <select id="categoria" required
                                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                                <option value="" disabled selected>Seleccione categoría...</option>
                            </select>
                        </div>

                        <!-- Establecimiento -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Establecimiento</label>
                            <input type="text" id="establecimiento" required placeholder="Nombre del local..."
                                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        </div>

                        <!-- Cliente -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Cliente Vinculado</label>
                            <select id="cliente" required
                                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                                <option value="" disabled selected>Seleccione cliente...</option>
                            </select>
                        </div>

                        <!-- Monto -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Monto (S/.)</label>
                            <input type="number" id="monto" step="0.01" required placeholder="0.00"
                                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        </div>

                        <!-- Descripción -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Descripción corta</label>
                            <textarea id="descripcion" rows="2" placeholder="Notas adicionales..."
                                class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all"></textarea>
                        </div>

                        <!-- Foto del Recibo -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Foto del Recibo (Opcional)</label>
                            <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-slate-200 rounded-xl bg-slate-50 hover:bg-slate-100 transition-all cursor-pointer group" id="photoDropzone">
                                <div class="flex flex-col items-center justify-center pt-5 pb-6 text-slate-400 group-hover:text-blue-500" id="photoPlaceholder">
                                    <svg class="w-8 h-8 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                    <p class="text-xs font-semibold">Cámara o Archivo</p>
                                </div>
                                <img id="photoPreview" class="hidden h-full w-full object-contain rounded-lg p-1" />
                                <input type="file" id="fotoInput" accept="image/*" capture="environment" class="hidden">
                            </label>
                            <button type="button" id="btnRemovePhoto" class="hidden mt-2 text-xs text-red-500 font-bold hover:underline">Eliminar foto</button>
                        </div>

                        <button type="submit" id="btnSubmit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-all shadow-lg shadow-blue-200 flex justify-center items-center">
                            <span>Registrar Gasto</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Listado y Filtros Section -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Tabla de Registros -->
                <div class="bg-white p-6 rounded-2xl custom-shadow border border-slate-100 overflow-hidden">
                    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <div class="flex items-center">
                            <h2 class="text-xl font-semibold text-slate-700 mr-4">Registros</h2>
                            <span id="recordCount"
                                class="bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-0.5 rounded-full">0
                                Registros</span>
                        </div>
                        <div class="flex gap-2 w-full md:w-auto">
                            <button onclick="toggleFilters()"
                                class="p-2 bg-slate-50 border border-slate-200 rounded-lg hover:bg-slate-100 transition-colors text-slate-600"
                                title="Filtros Avanzados">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 8.293A1 1 0 013 7.586V4z">
                                    </path>
                                </svg>
                            </button>
                            <div class="relative flex-1 md:w-64">
                                <input type="text" id="searchInput" placeholder="Buscar local..."
                                    class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all text-sm">
                                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none"
                                    stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Panel de Filtros Avanzados -->
                    <div id="filterPanel"
                        class="hidden bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6 space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Desde</label>
                                <input type="date" id="filterDateFrom"
                                    class="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Hasta</label>
                                <input type="date" id="filterDateTo"
                                    class="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label
                                    class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Categoría</label>
                                <select id="filterCategory"
                                    class="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                    <option value="">Todas</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Cliente</label>
                                <select id="filterClient"
                                    class="w-full p-2 bg-white border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                                    <option value="">Todos</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex justify-end gap-2">
                            <button onclick="clearFilters()"
                                class="text-xs font-bold text-slate-400 hover:text-slate-600 px-3 py-2 transition-colors">Limpiar</button>
                            <button onclick="fetchExpenses()"
                                class="bg-blue-600 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors shadow-sm">Aplicar
                                Filtros</button>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-slate-100">
                                    <th class="py-3 px-2 text-xs font-semibold text-slate-500 uppercase">Fecha</th>
                                    <th class="py-3 px-2 text-xs font-semibold text-slate-500 uppercase">Lugar / Cliente
                                    </th>
                                    <th class="py-3 px-2 text-xs font-semibold text-slate-500 uppercase">Categoría</th>
                                    <th class="py-3 px-2 text-xs font-semibold text-slate-500 uppercase">Monto</th>
                                    <th class="py-3 px-2 text-xs font-semibold text-slate-500 uppercase"></th>
                                </tr>
                            </thead>
                            <tbody id="recordsTable" class="text-sm">
                                <tr>
                                    <td colspan="5" class="py-8 text-center text-slate-400 italic">Cargando registros...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div id="toast"
                    class="fixed bottom-5 right-5 bg-blue-600 text-white px-6 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none z-50">
                    Mensaje del sistema
                </div>
            </div>
        </div>

        <!-- Edit Expense Modal -->
        <div id="editExpenseModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl p-6 w-full max-w-lg shadow-2xl border border-slate-100">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-slate-800">Editar Registro</h3>
                    <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <form id="editExpenseForm" class="space-y-4">
                    <input type="hidden" id="editDocId">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Fecha</label>
                            <input type="date" id="editFecha" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Monto (S/.)</label>
                            <input type="number" id="editMonto" step="0.01" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Establecimiento</label>
                        <input type="text" id="editEstablecimiento" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Categoría</label>
                        <select id="editCategoria" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Cliente</label>
                        <select id="editCliente" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Descripción</label>
                        <textarea id="editDescripcion" rows="2" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                    </div>

                    <!-- Foto del Recibo en Modal -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Foto del Recibo</label>
                        <div class="flex items-center gap-4">
                            <label class="flex-shrink-0 w-24 h-24 border-2 border-dashed border-slate-200 rounded-lg bg-slate-50 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-100 transition-colors">
                                <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                                <span class="text-[10px] text-slate-400 font-bold mt-1 uppercase">Cambiar</span>
                                <input type="file" id="editFotoInput" accept="image/*" capture="environment" class="hidden">
                            </label>
                            <div class="flex-1 h-24 bg-slate-50 rounded-lg border border-slate-100 overflow-hidden relative group">
                                <img id="editPhotoPreview" src="" class="w-full h-full object-contain hidden" />
                                <div id="editPhotoNoExist" class="w-full h-full flex items-center justify-center text-slate-300 text-xs italic">Sin foto</div>
                                <button type="button" id="btnRemoveEditPhoto" class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity hidden">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="flex justify-end gap-3 mt-8">
                        <button type="button" onclick="closeEditModal()" class="px-5 py-2.5 text-slate-500 font-semibold hover:bg-slate-100 rounded-lg transition-colors">
                            Cancelar
                        </button>
                        <button type="submit" id="btnUpdate" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg transition-all shadow-lg shadow-blue-100">
                            Guardar Cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Image Viewer Lightbox -->
        <div id="imageViewer" class="fixed inset-0 bg-black bg-opacity-90 hidden z-[60] flex items-center justify-center p-4">
            <button onclick="closeImageViewer()" class="absolute top-4 right-4 text-white hover:text-slate-300 transition-colors">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <img id="viewerImage" src="" class="max-w-full max-h-full object-contain shadow-2xl" />
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE DATOS
        // REMOVED: categorias (Now fetched from server)

        // REMOVED: ejecutivosDB (Authentication is now server-side)

        // REMOVED: clientes (Now fetched from server)

        let currentUser = null;
        let isRegisterMode = false;

        // INICIALIZACIÓN
        window.onload = () => {
            const clienteSelect = document.getElementById('cliente');
            const filterClient = document.getElementById('filterClient');

            loadUsers(); // Load users for login dropdown
            loadCategories(); // Load categories dynamically
            loadClients(); // Load clients dynamically

            // Copy options to edit modal selects when they are loaded
            // We'll do this inside loadCategories and loadClients

            // Event listener para búsqueda rápida
            document.getElementById('searchInput').addEventListener('input', debounce(fetchExpenses, 500));
        };

        async function loadCategories() {
            const categoriaSelect = document.getElementById('categoria');
            const filterCategory = document.getElementById('filterCategory');

            try {
                const response = await fetch('/api/categories');
                if (response.ok) {
                    const categories = await response.json();

                    const editCategoriaSelect = document.getElementById('editCategoria');

                    // Clear existing options (except default)
                    categoriaSelect.innerHTML = '<option value="" disabled selected>Seleccione categoría...</option>';
                    filterCategory.innerHTML = '<option value="">Todas</option>';
                    editCategoriaSelect.innerHTML = '<option value="" disabled selected>Seleccione categoría...</option>';

                    categories.forEach(c => {
                        categoriaSelect.add(new Option(c, c));
                        filterCategory.add(new Option(c, c));
                        editCategoriaSelect.add(new Option(c, c));
                    });
                } else {
                    console.error("Error loading categories");
                    showToast("Error al cargar categorías");
                }
            } catch (e) {
                console.error("Error fetching categories", e);
                showToast("Error de conexión al cargar categorías");
            }
        }

        async function loadClients() {
            const clienteSelect = document.getElementById('cliente');
            const filterClient = document.getElementById('filterClient');

            try {
                const response = await fetch('/api/clients');
                if (response.ok) {
                    const clients = await response.json();

                    const editClienteSelect = document.getElementById('editCliente');

                    // Clear existing options (except default)
                    clienteSelect.innerHTML = '<option value="" disabled selected>Seleccione cliente...</option>';
                    filterClient.innerHTML = '<option value="">Todos</option>';
                    editClienteSelect.innerHTML = '<option value="" disabled selected>Seleccione cliente...</option>';

                    clients.forEach(c => {
                        clienteSelect.add(new Option(c, c));
                        filterClient.add(new Option(c, c));
                        editClienteSelect.add(new Option(c, c));
                    });
                } else {
                    console.error("Error loading clients");
                    showToast("Error al cargar clientes");
                }
            } catch (e) {
                console.error("Error fetching clients", e);
                showToast("Error de conexión al cargar clientes");
            }
        }

        async function loadUsers() {
            const select = document.getElementById('loginUserSelect');
            try {
                const response = await fetch('/api/users');
                if (response.ok) {
                    const users = await response.json();
                    select.innerHTML = '<option value="" disabled selected>Seleccione su nombre...</option>';
                    users.sort().forEach(user => {
                        select.add(new Option(user, user));
                    });
                } else {
                    select.innerHTML = '<option value="" disabled selected>Error al cargar usuarios</option>';
                }
            } catch (e) {
                console.error("Error loading users", e);
                select.innerHTML = '<option value="" disabled selected>Error de conexión</option>';
            }
        }

        // UI HELPERS
        function toggleFilters() {
            const panel = document.getElementById('filterPanel');
            panel.classList.toggle('hidden');
        }

        function clearFilters() {
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            document.getElementById('filterCategory').value = '';
            document.getElementById('filterClient').value = '';
            fetchExpenses();
        }

        function toggleLoginMode() {
            isRegisterMode = !isRegisterMode;
            const title = document.getElementById('authTitle');
            const subTitle = document.getElementById('authSubtitle');
            const confirmPassDiv = document.getElementById('confirmPassDiv');
            const submitBtn = document.getElementById('loginSubmitBtn');
            const toggleBtn = document.getElementById('toggleAuthBtn');
            const loginPass = document.getElementById('loginPass');
            const confirmPass = document.getElementById('confirmLoginPass');

            const userSelect = document.getElementById('loginUserSelect');
            const userInput = document.getElementById('loginUserInput');

            if (isRegisterMode) {
                // SWITCH TO REGISTER (Input Mode)
                // title.innerText = "Registrar Nuevo Usuario"; // This element doesn't exist in the provided HTML
                subTitle.innerText = "Cree una cuenta para empezar a reportar";

                confirmPassDiv.classList.remove('hidden');
                confirmPass.required = true;

                userSelect.classList.add('hidden');
                userSelect.required = false;
                userSelect.disabled = true;

                userInput.classList.remove('hidden');
                userInput.required = true;
                userInput.disabled = false;
                userInput.focus();

                submitBtn.innerText = "Registrarse";
                toggleBtn.innerText = "¿Ya tiene cuenta? Inicie Sesión";
                loginPass.placeholder = "Contraseña nueva";
            } else {
                // SWITCH TO LOGIN (Dropdown Mode)
                // title.innerText = "Acceso Ejecutivo"; // This element doesn't exist in the provided HTML
                subTitle.innerText = "Ingrese sus credenciales para reportar";

                confirmPassDiv.classList.add('hidden');
                confirmPass.required = false;
                confirmPass.value = '';

                userSelect.classList.remove('hidden');
                userSelect.required = true;
                userSelect.disabled = false;

                userInput.classList.add('hidden');
                userInput.required = false;
                userInput.disabled = true;

                submitBtn.innerText = "Iniciar Sesión";
                toggleBtn.innerText = "¿Nuevo usuario? Regístrese aquí";
                loginPass.placeholder = "••••••••";

                // Refresh user list on switching back to login
                loadUsers();
            }
        }

        // LÓGICA DE AUTH (LOGIN / REGISTER)
        // Image processing: helper to resize image
        function resizeAndResample(file, maxWidth = 800) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = (maxWidth / width) * height;
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                };
            });
        }

        // Photo handling for Registration Form
        let registroFotoBase64 = null;
        const fotoInput = document.getElementById('fotoInput');
        const photoPreview = document.getElementById('photoPreview');
        const photoPlaceholder = document.getElementById('photoPlaceholder');
        const btnRemovePhoto = document.getElementById('btnRemovePhoto');

        fotoInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (file) {
                registroFotoBase64 = await resizeAndResample(file);
                photoPreview.src = registroFotoBase64;
                photoPreview.classList.remove('hidden');
                photoPlaceholder.classList.add('hidden');
                btnRemovePhoto.classList.remove('hidden');
            }
        };

        btnRemovePhoto.onclick = () => {
            registroFotoBase64 = null;
            fotoInput.value = '';
            photoPreview.classList.add('hidden');
            photoPlaceholder.classList.remove('hidden');
            btnRemovePhoto.classList.add('hidden');
        };

        // Photo handling for Edit Modal
        let editFotoBase64 = null;
        const editFotoInput = document.getElementById('editFotoInput');
        const editPhotoPreview = document.getElementById('editPhotoPreview');
        const editPhotoNoExist = document.getElementById('editPhotoNoExist');
        const btnRemoveEditPhoto = document.getElementById('btnRemoveEditPhoto');

        editFotoInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (file) {
                editFotoBase64 = await resizeAndResample(file);
                editPhotoPreview.src = editFotoBase64;
                editPhotoPreview.classList.remove('hidden');
                editPhotoNoExist.classList.add('hidden');
                btnRemoveEditPhoto.classList.remove('hidden');
            }
        };

        btnRemoveEditPhoto.onclick = () => {
            editFotoBase64 = null;
            editFotoInput.value = '';
            editPhotoPreview.classList.add('hidden');
            editPhotoNoExist.classList.remove('hidden');
            btnRemoveEditPhoto.classList.add('hidden');
        };

        // Submission Logic
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            // Get user from the active field
            let user;
            if (isRegisterMode) {
                user = document.getElementById('loginUserInput').value;
            } else {
                user = document.getElementById('loginUserSelect').value;
            }

            const pass = document.getElementById('loginPass').value;
            const errorMsg = document.getElementById('loginError');

            errorMsg.classList.add('hidden');

            if (isRegisterMode) {
                const confirmPass = document.getElementById('confirmLoginPass').value;
                if (pass !== confirmPass) {
                    showAuthError("Las contraseñas no coinciden");
                    return;
                }
                await registerUser(user, pass);
            } else {
                await loginUser(user, pass);
            }
        });

        function showAuthError(msg) {
            const errorMsg = document.getElementById('loginError');
            errorMsg.innerText = msg;
            errorMsg.classList.remove('hidden');
        }

        async function registerUser(username, password) {
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok) {
                    alert("Usuario registrado con éxito. Ahora puede iniciar sesión.");
                    toggleLoginMode(); // Switch back to login
                } else {
                    showAuthError(data.message || "Error al registrar");
                }
            } catch (error) {
                showAuthError("Error de conexión");
            }
        }

        async function loginUser(username, password) {
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (response.ok) {
                    if (data.role === 'admin') {
                        window.location.href = '/admin';
                        return;
                    }
                    currentUser = data.username;
                    showDashboard();
                    fetchExpenses();
                } else {
                    showAuthError(data.message || "Credenciales inválidas");
                }
            } catch (error) {
                showAuthError("Error de conexión");
            }
        }

        function showDashboard() {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('mainView').classList.remove('hidden');
            document.getElementById('currentUserLabel').innerText = currentUser;
            document.getElementById('ejecutivo').value = currentUser;
            document.getElementById('fecha').valueAsDate = new Date();
        }

        function logout() {
            currentUser = null;
            document.getElementById('loginPass').value = '';
            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
        }

        // COMUNICACIÓN CON API
        async function fetchExpenses() {
            if (!currentUser) return;

            const search = document.getElementById('searchInput').value;
            const dateFrom = document.getElementById('filterDateFrom').value;
            const dateTo = document.getElementById('filterDateTo').value;
            const category = document.getElementById('filterCategory').value;
            const client = document.getElementById('filterClient').value;

            let url = `/api/expenses?user_id=${encodeURIComponent(currentUser)}&search=${encodeURIComponent(search)}`;
            if (dateFrom) url += `&date_from=${dateFrom}`;
            if (dateTo) url += `&date_to=${dateTo}`;
            if (category) url += `&category=${encodeURIComponent(category)}`;
            if (client) url += `&client=${encodeURIComponent(client)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === "error") {
                    console.error("Error del servidor:", data.message);
                    showToast("Error de Firestore (ver consola)");
                    return;
                }

                updateUI(data);
            } catch (error) {
                console.error("Error al obtener gastos:", error);
                showToast("Error al cargar registros");
            }
        }

        document.getElementById('expenseForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerText = 'Registrando...';

            const entry = {
                ejecutivo: currentUser,
                fecha: document.getElementById('fecha').value,
                categoria: document.getElementById('categoria').value,
                establecimiento: document.getElementById('establecimiento').value,
                cliente: document.getElementById('cliente').value,
                monto: parseFloat(document.getElementById('monto').value),
                descripcion: document.getElementById('descripcion').value,
                moneda: "PEN",
                reportado_en: new Date().toISOString(),
                foto_recibo: registroFotoBase64 // Added field
            };

            try {
                const response = await fetch('/api/expenses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(entry)
                });

                if (response.ok) {
                    showToast("Gasto registrado correctamente");
                    this.reset();
                    registroFotoBase64 = null;
                    photoPreview.classList.add('hidden');
                    photoPlaceholder.classList.remove('hidden');
                    btnRemovePhoto.classList.add('hidden');
                    document.getElementById('ejecutivo').value = currentUser;
                    document.getElementById('fecha').valueAsDate = new Date();
                    fetchExpenses();
                } else {
                    throw new Error("Fallo en el servidor");
                }
            } catch (error) {
                showToast("Error al guardar el registro");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Registrar Gasto';
            }
        });

        async function deleteRecord(id) {
            if (!confirm("¿Está seguro de eliminar este registro?")) return;

            try {
                const response = await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showToast("Registro eliminado");
                    fetchExpenses();
                } else {
                    showToast("Error al eliminar");
                }
            } catch (error) {
                showToast("Error de conexión");
            }
        }

        let currentExpenses = [];

        function openEditModal(id) {
            const entry = currentExpenses.find(e => e.id === id);
            if (!entry) return;

            document.getElementById('editDocId').value = id;
            document.getElementById('editFecha').value = entry.fecha;
            document.getElementById('editMonto').value = entry.monto;
            document.getElementById('editEstablecimiento').value = entry.establecimiento;
            document.getElementById('editCategoria').value = entry.categoria;
            document.getElementById('editCliente').value = entry.cliente;
            document.getElementById('editDescripcion').value = entry.descripcion || '';
            
            // Handle Photo in Edit Modal
            editFotoBase64 = entry.foto_recibo || null;
            if (editFotoBase64) {
                editPhotoPreview.src = editFotoBase64;
                editPhotoPreview.classList.remove('hidden');
                editPhotoNoExist.classList.add('hidden');
                btnRemoveEditPhoto.classList.remove('hidden');
            } else {
                editPhotoPreview.classList.add('hidden');
                editPhotoNoExist.classList.remove('hidden');
                btnRemoveEditPhoto.classList.add('hidden');
            }

            document.getElementById('editExpenseModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editExpenseModal').classList.add('hidden');
            editFotoBase64 = null;
            editFotoInput.value = '';
        }

        document.getElementById('editExpenseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('editDocId').value;
            const btn = document.getElementById('btnUpdate');
            btn.disabled = true;
            btn.innerText = 'Actualizando...';

            const updateData = {
                fecha: document.getElementById('editFecha').value,
                monto: parseFloat(document.getElementById('editMonto').value),
                establecimiento: document.getElementById('editEstablecimiento').value,
                categoria: document.getElementById('editCategoria').value,
                cliente: document.getElementById('editCliente').value,
                descripcion: document.getElementById('editDescripcion').value,
                foto_recibo: editFotoBase64 // Update field
            };

            try {
                const response = await fetch(`/api/expenses/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });

                if (response.ok) {
                    showToast("Gasto actualizado correctamente");
                    closeEditModal();
                    fetchExpenses();
                } else {
                    showToast("Error al actualizar");
                }
            } catch (error) {
                showToast("Error de conexión");
            } finally {
                btn.disabled = false;
                btn.innerText = 'Guardar Cambios';
            }
        });

        function updateUI(expenseData) {
            currentExpenses = expenseData;
            const tableBody = document.getElementById('recordsTable');
            document.getElementById('recordCount').innerText = `${expenseData.length} Registros`;

            if (expenseData.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-slate-400 italic">No se encontraron registros</td></tr>';
            } else {
                tableBody.innerHTML = expenseData.map(item => `
                    <tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                        <td class="py-4 px-2 text-slate-500 font-medium">${item.fecha}</td>
                        <td class="py-4 px-2">
                            <div class="font-bold text-slate-800">${item.establecimiento}</div>
                            <div class="text-[11px] text-blue-500 font-medium uppercase font-bold">${item.cliente}</div>
                            ${currentUser.startsWith('Gerente-') ? `<div class="text-[9px] text-slate-400 italic">Por: ${item.ejecutivo}</div>` : ''}
                        </td>
                        <td class="py-4 px-2">
                            <span class="px-2 py-1 bg-slate-100 text-slate-600 rounded text-[10px] font-bold uppercase">${item.categoria}</span>
                        </td>
                        <td class="py-4 px-2 font-bold text-slate-900">S/. ${item.monto.toLocaleString('es-PE', { minimumFractionDigits: 2 })}</td>
                        <td class="py-4 px-2 text-right">
                            <div class="flex gap-2 justify-end">
                                ${item.foto_recibo ? `
                                <button onclick="viewPhoto('${item.foto_recibo}')" class="text-blue-500 hover:text-blue-700 transition-colors" title="Ver Recibo">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                                </button>
                                ` : `
                                <div class="w-5 h-5"></div>
                                `}
                                <button onclick="openEditModal('${item.id}')" class="text-slate-300 hover:text-blue-500 transition-colors" title="Editar">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                                </button>
                                <button onclick="deleteRecord('${item.id}')" class="text-slate-300 hover:text-red-500 transition-colors" title="Eliminar">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            }
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        }

        function viewPhoto(base64) {
            if (!base64) return;
            const viewer = document.getElementById('imageViewer');
            const img = document.getElementById('viewerImage');
            img.src = base64;
            viewer.classList.remove('hidden');
        }

        function closeImageViewer() {
            document.getElementById('imageViewer').classList.add('hidden');
        }

        function debounce(func, timeout = 300) {
            let timer;
            return (...args) => {
                clearTimeout(timer);
                timer = setTimeout(() => { func.apply(this, args); }, timeout);
            };
        }
    </script>
</body>
